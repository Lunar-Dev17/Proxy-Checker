[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxy-check"
version = "0.1.0"
description = "A fast async CLI tool that tests proxy lists for web scraping."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "proxy-check contributors" }
]
dependencies = [
    "httpx[socks]>=0.28.0",
    "httpx-socks>=0.13.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
proxy-check = "proxy_check.cli:app"

[project.urls]
Homepage = "https://github.com/Lunar-Dev17/Proxy-Checker"
Repository = "https://github.com/Lunar-Dev17/Proxy-Checker.git"
Issues = "https://github.com/Lunar-Dev17/Proxy-Checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (standard Typer usage)
]

[tool.ruff.lint.isort]
known-first-party = ["proxy_check"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

